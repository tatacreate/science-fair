    <script>
      // Pre-warm Google API iframes module to eliminate Firebase Auth dynamic script loadJS el.onerror issues
      window.addEventListener('DOMContentLoaded', function () {
        try {
          if (window.gapi && window.gapi.load) {
            window.gapi.load('gapi.iframes', function () {});
          }
        } catch (e) {
          console.warn('GAPI pre-warm notice:', e);
        }
      });
    </script>
